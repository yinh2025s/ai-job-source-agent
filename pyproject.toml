[project]
name = "ai-job-source-agent"
version = "0.1.0b2"
description = "Evidence-gated beta for resolving LinkedIn jobs to verified official openings."
requires-python = ">=3.10,<3.14"
dependencies = []

[project.scripts]
ai-job-source-agent = "job_source_agent.cli:main"

[project.optional-dependencies]
browser = ["playwright>=1.45"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["job_source_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
